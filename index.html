<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="深坑國小 3D 互動校園導覽：切換樓層、搜尋教室、對照 Google 地圖。">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>深坑國小 3D 校園</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: full-bleed 3D scene. Navy header toolbar on top, campus-guide sidebar left,
   floor rail right, controls hint bottom-center, detail card top-right. */
:root{
  --bg:#e4ecef; --sky:#dce7ec;
  --head:#1d2b3a; --head-ink:#ffffff; --head-muted:#a9bccb; --head-btn:rgba(255,255,255,.08);
  --panel:rgba(255,255,255,.94); --panel-solid:#ffffff;
  --ink:#1c2632; --muted:#5d6b78; --line:rgba(28,38,50,.12);
  --accent:#f2b705; --accent-ink:#1c2632; --chip:#eef2f4; --hover:#e6edf1;
  --shadow:0 6px 24px rgba(20,35,50,.16);
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --sky:#16212c; --head:#0d151d; --head-btn:rgba(255,255,255,.07);
  --panel:rgba(22,31,41,.94); --panel-solid:#16202a;
  --ink:#e8eef3; --muted:#9aa9b6; --line:rgba(232,238,243,.13); --accent:#f5c542; --accent-ink:#141b22; --chip:#22303d; --hover:#263646;
  --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f161d; --sky:#16212c; --head:#0d151d; --head-btn:rgba(255,255,255,.07);
  --panel:rgba(22,31,41,.94); --panel-solid:#16202a;
  --ink:#e8eef3; --muted:#9aa9b6; --line:rgba(232,238,243,.13); --accent:#f5c542; --accent-ink:#141b22; --chip:#22303d; --hover:#263646;
  --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* header */
.head{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));height:64px;display:flex;align-items:center;gap:12px;padding:0 12px 0 14px;background:var(--head);color:var(--head-ink);border-radius:16px;box-shadow:var(--shadow);z-index:20}
.seal{width:40px;height:40px;border-radius:11px;background:var(--accent);color:#1c2632;display:grid;place-items:center;font-weight:900;font-size:19px;flex:0 0 auto}
.ttl{min-width:0}
.ttl h1{margin:0;font-size:18px;font-weight:900;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl p{margin:1px 0 0;font-size:11.5px;color:var(--head-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.hbtns{margin-left:auto;display:flex;gap:6px}
.hb{height:42px;min-width:42px;padding:0 10px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:11px;border:1px solid rgba(255,255,255,.14);background:var(--head-btn);color:var(--head-ink);cursor:pointer;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.hb:hover{background:rgba(255,255,255,.16)}
.hb[aria-pressed="true"]{background:var(--accent);color:#1c2632;border-color:transparent}
.hb.map{background:#2f7fd1;border-color:transparent}
.hb.map:hover{background:#3a8ce0}
.hb .t{display:inline}
.menu{display:none}

/* sidebar */
.side{position:fixed;left:12px;top:calc(86px + env(safe-area-inset-top,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));width:276px;display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(10px);border-radius:16px;box-shadow:var(--shadow);z-index:15;overflow:hidden;border:1px solid var(--line)}
.side.collapsed{bottom:auto}
.side-h{display:flex;align-items:center;gap:8px;padding:12px 12px 10px 16px;font-weight:900;font-size:15px}
.side-h .x{margin-left:auto;width:30px;height:30px;border-radius:8px;border:0;background:var(--chip);cursor:pointer;display:grid;place-items:center}
.side.collapsed .side-b{display:none}
.side-b{display:flex;flex-direction:column;min-height:0;flex:1}
.search{position:relative;margin:0 12px 8px}
.search input{width:100%;box-sizing:border-box;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--panel-solid);color:var(--ink);font-size:14px;padding:0 10px 0 36px}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:11px;top:11px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.list{overflow-y:auto;padding:0 8px 12px;flex:1;min-height:0}
.sec{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700;margin:12px 8px 4px}
.item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:9px 8px;border-radius:10px;cursor:pointer}
.item:hover,.item[aria-selected="true"]{background:var(--hover)}
.item .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;color:#fff;font:700 12px var(--font-mono)}
.item .nm{font-weight:700;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .wh{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
.empty{padding:12px 10px;color:var(--muted);font-size:13px}
.code{font:600 12px var(--font-mono);padding:2px 7px;border-radius:6px;color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums}

/* floor rail */
.floors{position:fixed;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;background:var(--panel);backdrop-filter:blur(10px);padding:6px;border-radius:14px;box-shadow:var(--shadow);z-index:15;border:1px solid var(--line)}
.floors button{border:0;background:none;width:50px;height:40px;border-radius:10px;font:700 14px var(--font-body);cursor:pointer;color:var(--muted)}
.floors button:hover{background:var(--hover)}
.floors button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* hint bar */
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:6px;background:var(--head);color:var(--head-ink);border-radius:999px;padding:6px 6px 6px 16px;box-shadow:var(--shadow);font-size:13px;z-index:15;max-width:calc(100% - 32px);box-sizing:border-box}
.hint ul{display:flex;gap:16px;list-style:none;margin:0;padding:0;white-space:nowrap;overflow:hidden}
.hint li{display:flex;align-items:center;gap:5px}
.hint li b{color:var(--accent);font-weight:700}
.hint .tg{border:0;background:rgba(255,255,255,.1);width:30px;height:30px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--head-ink);flex:0 0 auto}
.hint.min ul{display:none}
.hint.min{padding-left:6px}
.hint.min::before{content:"操作說明";padding:0 4px 0 10px}
.hint .touch{display:none}

/* detail card */
.card{position:fixed;right:80px;top:calc(86px + env(safe-area-inset-top,0px));width:330px;box-sizing:border-box;background:var(--panel-solid);border-radius:16px;box-shadow:var(--shadow);padding:16px;border:1px solid var(--line);z-index:16}
.card .cin{max-height:calc(100vh - 220px);overflow-y:auto;overscroll-behavior:contain}
.card .row{display:flex;gap:10px;align-items:center}
.card .code{font-size:15px;padding:4px 10px}
.card h3{margin:0;font-size:19px;font-weight:900;line-height:1.3;text-wrap:balance;min-width:0}
.card .x{margin-left:auto;border:0;background:var(--chip);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:15px;flex:0 0 auto}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:12px 0 0;font-size:13.5px}
.card dt{color:var(--muted)}
.card dd{margin:0;font-weight:500}
.card .note{margin:10px 0 0;font-size:12px;color:var(--muted)}
.card .lnk{margin-top:12px;border:1px solid var(--line);background:var(--chip);border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:700;font-size:13px}
.fl{margin-top:12px}
.fl h4{margin:0 0 6px;font-size:12px;color:var(--muted);letter-spacing:.08em;display:flex;gap:8px;align-items:center}
.fl h4 span{font:700 12px var(--font-mono);color:var(--ink);background:var(--chip);padding:1px 7px;border-radius:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:0;cursor:pointer;display:flex;align-items:center;gap:5px;background:var(--chip);border-radius:8px;padding:4px 8px 4px 6px;font-size:12.5px;font-weight:500;text-align:left}
.chip:hover{background:var(--hover)}
.chip i{width:8px;height:8px;border-radius:3px;flex:0 0 auto}
.meta{font-size:13px;color:var(--muted);margin:4px 0 0}

/* legend popover */
.legend{position:fixed;right:12px;top:calc(86px + env(safe-area-inset-top,0px));background:var(--panel-solid);border-radius:14px;box-shadow:var(--shadow);padding:10px;width:200px;box-sizing:border-box;z-index:18;border:1px solid var(--line)}
.legend h2{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:2px 6px 6px;font-weight:700}
.legend button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:5px 6px;border-radius:8px;cursor:pointer;font-size:13px;text-align:left}
.legend button:hover{background:var(--hover)}
.legend button[aria-pressed="true"]{background:var(--chip);font-weight:700}
.legend .sw{width:14px;height:14px;border-radius:4px;flex:0 0 auto}
.legend .n{margin-left:auto;font:500 11px var(--font-mono);color:var(--muted)}

/* google map modal */
.modal{position:fixed;inset:0;background:rgba(10,16,22,.55);z-index:40;display:grid;place-items:center;padding:16px}
.modal-box{background:var(--panel-solid);border-radius:16px;box-shadow:var(--shadow);width:min(1000px,100%);height:min(720px,100%);display:flex;flex-direction:column;overflow:hidden}
.modal-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.modal-h b{font-size:15px}
.modal-h a{margin-left:auto;font-size:13px;font-weight:700;color:#2f7fd1;text-decoration:none}
.modal-h button{border:0;background:var(--chip);width:34px;height:34px;border-radius:9px;cursor:pointer}
.modal iframe{border:0;flex:1;width:100%}

#tip{position:fixed;pointer-events:none;background:#1c2632;color:#fff;font-size:12.5px;padding:5px 9px;border-radius:7px;white-space:nowrap;transform:translate(12px,12px);z-index:30}
.credit{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--muted);max-width:26ch;text-align:right;line-height:1.45;z-index:5}

/* 3D labels */
.tag{pointer-events:auto;cursor:pointer;display:flex;align-items:stretch;border-radius:7px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.18);font:700 12px var(--font-body);white-space:nowrap;transform:translateY(-6px);user-select:none}
.tag b{background:var(--panel-solid);color:var(--ink);padding:3px 7px;font-weight:700}
.tag i{font:600 11px var(--font-mono);font-style:normal;color:#fff;padding:3px 6px;display:flex;align-items:center}
.tag.wc b{padding:2px 5px;font-size:10.5px;font-weight:500;color:var(--muted)}
.tag.sel{outline:3px solid var(--accent)}
.btag{pointer-events:auto;cursor:pointer;background:#1c2632;color:#fff;font:900 13px var(--font-body);padding:5px 10px;border-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,.25);white-space:nowrap;letter-spacing:.04em}
.btag small{font:600 11px var(--font-mono);color:#f2b705;margin-right:6px}
.ltag{pointer-events:auto;cursor:pointer;background:rgba(255,255,255,.9);color:#3a4652;font:500 11.5px var(--font-body);padding:3px 8px;border-radius:999px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.compact .tag i,.compact .tag.wc,.compact .tag .full{display:none}
.tag .sh{display:none}.compact .tag .sh{display:inline}
.nolabels .tag{display:none!important}

@media (max-width:860px){
  .hb .t{display:none}
  .credit{display:none}
}
@media (max-width:720px){
  .head{height:56px;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));padding:0 8px;gap:8px}
  .seal{display:none}
  .menu{display:flex}
  .ttl h1{font-size:15px}
  .ttl p{display:none}
  .hbtns{gap:4px}
  .hb{height:38px;min-width:38px;padding:0 8px}
  .hb.opt{display:none}
  .side{backdrop-filter:none;background:var(--panel-solid);left:8px;right:8px;width:auto;top:calc(72px + env(safe-area-inset-top,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:25}
  .side:not(.open){display:none}
  .side .side-h .x{display:none}
  .floors{top:auto;transform:none;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:8px;right:8px;flex-direction:row;justify-content:space-between;overflow-x:auto}
  .floors button{width:auto;flex:1;min-width:40px;height:38px;font-size:13px}
  .hint{display:none}
  .card{left:8px;right:8px;width:auto;top:auto;bottom:calc(68px + env(safe-area-inset-bottom,0px))}
  .card .cin{max-height:40vh}
  .legend{right:8px;top:calc(72px + env(safe-area-inset-top,0px))}
}
@media (hover:none){ .hint .mouse{display:none} .hint .touch{display:flex} }
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

</head>
<body>
<div id="stage"><div id="labels"></div></div>

<header class="head">
  <button class="hb menu" id="menuBtn" type="button" aria-label="校園導覽選單" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div class="seal" aria-hidden="true">深</div>
  <div class="ttl"><h1>深坑國小 3D 互動校園導覽</h1><p>新北市深坑區深坑國民小學 · 115 學年度教室配置（115.06.10 版）</p></div>
  <div class="hbtns">
    <button class="hb" id="homeBtn" type="button" title="回到鳥瞰視角" aria-label="鳥瞰"><svg class="i" viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg><span class="t">鳥瞰</span></button>
    <button class="hb opt" id="spinBtn" type="button" title="自動旋轉" aria-label="自動旋轉" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg><span class="t">旋轉</span></button>
    <button class="hb opt" id="lblBtn" type="button" title="顯示教室標籤" aria-label="教室標籤" aria-pressed="true"><svg class="i" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/></svg><span class="t">標籤</span></button>
    <button class="hb" id="legBtn" type="button" title="空間類別圖例" aria-label="圖例" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg><span class="t">圖例</span></button>
    <span id="mapSlot"></span>
    <button class="hb" id="themeBtn" type="button" title="切換深色／淺色" aria-label="切換深色模式"><svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
  </div>
</header>

<aside class="side" id="side" aria-label="校園導覽">
  <div class="side-h"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>校園導覽<button class="x" id="sideX" type="button" aria-label="收合導覽" aria-expanded="true">−</button></div>
  <div class="side-b">
    <div class="search" role="search">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="找教室：143、四年1班、健康中心" autocomplete="off" aria-label="搜尋教室或地點">
    </div>
    <div class="list" id="list"></div>
  </div>
</aside>

<nav class="floors" id="floors" aria-label="切換樓層"></nav>

<div class="hint" id="hint">
  <ul class="mouse"><li><b>滑鼠左鍵</b>旋轉視角</li><li><b>滑鼠右鍵</b>平移鏡頭</li><li><b>滾輪</b>放大／縮小</li><li><b>點擊建築物</b>查看詳細資訊</li></ul>
  <ul class="touch"><li><b>單指</b>旋轉</li><li><b>雙指</b>縮放／平移</li><li><b>點一下</b>查看資訊</li></ul>
  <button class="tg" id="hintTg" type="button" aria-label="收合操作說明" aria-expanded="true"><svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="m6 9 6 6 6-6"/></svg></button>
</div>

<aside class="legend" id="legend" hidden aria-label="空間類別"><h2>空間類別 · 點選可篩選</h2><div id="legendList"></div></aside>
<section class="card" id="card" hidden aria-live="polite"></section>
<div class="credit">依深坑國小 115 學年度教室配置圖與衛星空拍位置繪製，比例為示意。</div>

}

const counts={}; DATA.rooms.forEach(r=>counts[r.cat]=(counts[r.cat]||0)+1);
const legend=document.getElementById('legend'), legendList=document.getElementById('legendList'), legBtn=document.getElementById('legBtn');
Object.entries(CAT).filter(([k])=>k!=='hall').forEach(([k,[n,c]])=>{
  const bt=document.createElement('button'); bt.type='button'; bt.setAttribute('aria-pressed','false');
  bt.innerHTML=`<span class="sw" style="background:${c}"></span>${n}<span class="n">${counts[k]||0}</span>`;
  bt.onclick=()=>{ catSel=catSel===k?null:k; legendList.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false')); if(catSel) bt.setAttribute('aria-pressed','true'); applyView(); };
  legendList.append(bt);
});
legBtn.onclick=()=>{ legend.hidden=!legend.hidden; legBtn.setAttribute('aria-pressed',String(!legend.hidden)); if(!legend.hidden) card.hidden=true; };

// ---------- pin ----------
const pin=new THREE.Group();
{ const pm=new THREE.MeshStandardMaterial({color:0xf2b705,emissive:0x6b4f00,roughness:.4});
  const cone=new THREE.Mesh(new THREE.ConeGeometry(1.1,2.6,20),pm); cone.rotation.x=Math.PI; cone.position.y=1.3;
  const ball=new THREE.Mesh(new THREE.SphereGeometry(1.25,20,14),pm); ball.position.y=3.2; pin.add(cone,ball); }
pin.visible=false; scene.add(pin);
function updatePin(){
  if(!selected){ pin.visible=false; return; }
  const f=selected.floors[0], m=selected.meshes[0];
  pin.visible=true; pin.userData.y=yBase(f)+FH+(selected.label?3.2:1); pin.position.set(m.position.x,pin.userData.y,m.position.z);
}

// ---------- detail card ----------
const card=document.getElementById('card');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function clearSel(){ if(selected){ selected.meshes.forEach(m=>m.material.emissive.setHex(0)); selected.label&&selected.label.element.classList.remove('sel'); } selected=null; }
function select(r,{fly=false}={}){
  clearSel(); selB=null;
  if(!r){ card.hidden=true; applyView(); return; }
  selected=r; legend.hidden=true; legBtn.setAttribute('aria-pressed','false');
  const f=r.floors[0];
  if(r.cat!=='stair'&&floorSel!==f) setFloor(f); else applyView();
  r.label&&r.label.element.classList.add('sel');
  const b=r.bld, col=CAT[r.cat][1];
  const rawDiff=r.raw.replace(/\s+/g,'')!==(r.code+r.name).replace(/\s+/g,'');
  card.innerHTML=`<div class="cin"><div class="row">${r.code?`<span class="code" style="background:${col}">${esc(r.code)}</span>`:''}<h3>${esc(r.name)}</h3><button class="x" type="button" aria-label="關閉">✕</button></div>
  <dl><dt>位置</dt><dd>${b.no}號 ${b.name} · ${r.floors.map(fl).join('、')}</dd><dt>類別</dt><dd>${CAT[r.cat][0]}</dd>${rawDiff?`<dt>原表</dt><dd>${esc(r.raw)}</dd>`:''}</dl>
  ${r.dot?'<p class="note">原配置表在此空間標有 ●</p>':''}
  <button class="lnk" type="button">看 ${b.name} 全部空間</button></div>`;
  card.querySelector('.x').onclick=()=>select(null);
  card.querySelector('.lnk').onclick=()=>selectBuilding(b);
  card.hidden=false;
  if(fly){ const m=r.meshes[0]; flyTo(new THREE.Vector3(m.position.x,yBase(f)+FH/2,m.position.z),55); }
  try{ if(r.code) history.replaceState(null,'','#r'+r.code.replace(/\//g,'-')); }catch(e){}
  closeDrawer();
}
function selectBuilding(b){
  clearSel(); selB=b; legend.hidden=true; legBtn.setAttribute('aria-pressed','false');
  if(floorSel!=='all') setFloor('all'); else applyView();
  const rooms=DATA.rooms.filter(r=>r.b===b.id);
  const nRooms=rooms.filter(r=>!['toilet','stair','hall'].includes(r.cat)).length;
  const nStairs=rooms.filter(r=>r.cat==='stair').length;
  const floorsHtml=b.floors.slice().reverse().map(f=>{
    const list=rooms.filter(r=>r.floors.includes(f)&&!['stair','hall'].includes(r.cat)).sort((a,c)=>a.a0-c.a0);
    const main=list.filter(r=>r.cat!=='toilet'), wc=list.filter(r=>r.cat==='toilet').length;
    if(!main.length&&!wc) return '';
    return `<div class="fl"><h4><span>${fl(f)}</span>${main.length} 間${wc?` · 廁所 ${wc}`:''}</h4><div class="chips">${main.map(r=>`<button class="chip" type="button" data-id="${r.id}"><i style="background:${CAT[r.cat][1]}"></i>${esc(r.short||r.name)}${r.code?` <span style="color:var(--muted);font:500 11px var(--font-mono)">${esc(r.code)}</span>`:''}</button>`).join('')}</div></div>`;
  }).join('');
  card.innerHTML=`<div class="cin"><div class="row"><span class="code" style="background:#1c2632">${b.no}號</span><h3>${b.name}</h3><button class="x" type="button" aria-label="關閉">✕</button></div>
  <p class="meta">${b.floors.filter(f=>f>0).length} 層樓${b.floors.includes(0)?'＋地下室':''} · ${nRooms} 個空間${nStairs?` · 樓梯／電梯 ${nStairs}`:''} · 長約 ${Math.round(b.len)} 公尺</p>${floorsHtml}</div>`;
  card.querySelector('.x').onclick=()=>{ selB=null; card.hidden=true; applyView(); };
  card.querySelectorAll('.chip').forEach(c=>c.onclick=()=>select(DATA.rooms[+c.dataset.id],{fly:true}));
  card.hidden=false; card.querySelector('.cin').scrollTop=0;
  flyTo(b.center.clone().setY(yBase(b.top)/2+2),Math.max(60,b.len*1.2));
  closeDrawer();
}
function goLandmark(L){ select(null); selB=null; setFloor('all'); flyTo(L.pos.clone().setY(2),55); closeDrawer(); }

// ---------- camera ----------
let anim=null;
function flyTo(target,dist){
  const a=innerWidth/innerHeight; if(a<1) dist*=Math.min(2.4,.85/a);
  const dir=camera.position.clone().sub(controls.target).normalize();
  if(dir.y<.55){ dir.y=.55; dir.normalize(); }
  target=target.clone();
  if(innerWidth<=720){ const g=new THREE.Vector3(dir.x,0,dir.z).normalize(); target.add(g.multiplyScalar(dist*.32)); }  // phone: card covers the lower half
  anim={t0:performance.now(),dur:matchMedia('(prefers-reduced-motion: reduce)').matches?1:850,fromP:camera.position.clone(),toP:target.clone().add(dir.multiplyScalar(dist)),fromT:controls.target.clone(),toT:target};
}
function homePos(){
  const a=innerWidth/innerHeight, tv=Math.tan(THREE.MathUtils.degToRad(19)), th=tv*a;
  const d=Math.max(90/th,95/tv)*.98;
  return new THREE.Vector3(d*.1,d*.74,d*.66);
}
const HOME_T=new THREE.Vector3(0,0,-6);
const homeT=()=>HOME_T.clone().setX(innerWidth>720?-22:0);
function home(){ anim={t0:performance.now(),dur:850,fromP:camera.position.clone(),toP:homePos().add(homeT()),fromT:controls.target.clone(),toT:homeT()}; }
document.getElementById('homeBtn').onclick=()=>{ select(null); selB=null; card.hidden=true; setFloor('all'); home(); };
const spinBtn=document.getElementById('spinBtn');
spinBtn.onclick=()=>{ controls.autoRotate=!controls.autoRotate; spinBtn.setAttribute('aria-pressed',String(controls.autoRotate)); };
const lblBtn=document.getElementById('lblBtn');
lblBtn.onclick=()=>{ const on=lblBtn.getAttribute('aria-pressed')!=='true'; lblBtn.setAttribute('aria-pressed',String(on)); labelsEl.classList.toggle('nolabels',!on); };
document.getElementById('themeBtn').onclick=()=>{ const root=document.documentElement; const dark=getComputedStyle(root).colorScheme.includes('dark'); root.setAttribute('data-theme',dark?'light':'dark'); };

// ---------- Google Map ----------
const mapSlot=document.getElementById('mapSlot');
const mapIcon='<svg class="i" viewBox="0 0 24 24"><path d="M12 21s-6-5.6-6-10.5a6 6 0 0 1 12 0C18 15.4 12 21 12 21z"/><circle cx="12" cy="10.5" r="2.2"/></svg><span class="t">Google 地圖</span>';
if(MAP_MODE==='embed'){
  const bt=document.createElement('button'); bt.type='button'; bt.className='hb map'; bt.title='開啟 Google 地圖衛星圖'; bt.setAttribute('aria-label','Google 地圖'); bt.innerHTML=mapIcon; mapSlot.replaceWith(bt);
  const modal=document.getElementById('mapModal');
  bt.onclick=()=>{ modal.innerHTML=`<div class="modal-box" role="dialog" aria-label="Google 地圖"><div class="modal-h"><b>深坑國小 · Google 地圖衛星圖</b><a href="${GMAP_LINK}" target="_blank" rel="noopener">在 Google 地圖開啟 ↗</a><button type="button" aria-label="關閉">✕</button></div><iframe src="${GMAP_EMBED}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="深坑國小 Google 地圖"></iframe></div>`;
    modal.hidden=false; modal.querySelector('button').onclick=()=>{ modal.hidden=true; modal.innerHTML=''; }; modal.onclick=e=>{ if(e.target===modal){ modal.hidden=true; modal.innerHTML=''; } }; };
  addEventListener('keydown',e=>{ if(e.key==='Escape'&&!modal.hidden){ modal.hidden=true; modal.innerHTML=''; } });
} else {
  const a=document.createElement('a'); a.className='hb map'; a.href=GMAP_LINK; a.target='_blank'; a.rel='noopener'; a.title='在 Google 地圖開啟深坑國小'; a.setAttribute('aria-label','Google 地圖'); a.innerHTML=mapIcon; mapSlot.replaceWith(a);
}

// ---------- sidebar: guide list + search ----------
const side=document.getElementById('side'), list=document.getElementById('list'), q=document.getElementById('q');
const menuBtn=document.getElementById('menuBtn'), sideX=document.getElementById('sideX');
menuBtn.onclick=()=>{ const o=!side.classList.contains('open'); side.classList.toggle('open',o); menuBtn.setAttribute('aria-pressed',String(o)); };
function closeDrawer(){ if(side.classList.contains('open')){ side.classList.remove('open'); menuBtn.setAttribute('aria-pressed','false'); } }
sideX.onclick=()=>{ const c=!side.classList.contains('collapsed'); side.classList.toggle('collapsed',c); sideX.textContent=c?'+':'−'; sideX.setAttribute('aria-expanded',String(!c)); };
const norm=s=>String(s).toLowerCase().replace(/\s+/g,'').replace(/[（）()、，,·]/g,'');
const NUM={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6};
const index=[];
DATA.rooms.forEach(r=>{ let alias=''; if(r.short){ const n=NUM[r.short[0]]; alias=`${n}年${r.short[1]}班 ${n}-${r.short[1]} ${r.short}`; }
  index.push({type:'room',r,label:r.name,code:r.code,where:`${r.bld.name} ${r.floors.map(fl).join('/')}`,hay:norm([r.code,r.name,r.short||'',alias,r.raw,CAT[r.cat][0]].join(' ')),col:CAT[r.cat][1]}); });
DATA.buildings.forEach(b=>index.push({type:'bld',b,label:`${b.no}號 ${b.name}`,code:'',where:'建築',hay:norm(`${b.no}號${b.name}`),col:'#1c2632'}));
LANDMARKS.forEach(l=>index.push({type:'lm',l,label:l.name,code:'',where:'校園地點',hay:norm(l.name),col:'#7d8790'}));
let hits=[], active=0;
function itemHtml(e,i){
  const ic=e.type==='room'?`<span class="code" style="background:${e.col}">${esc(e.code||'·')}</span>`:`<span class="ic" style="background:${e.col}">${e.type==='bld'?e.b.no:esc(e.l.icon||'·')}</span>`;
  return `<button class="item" type="button" data-i="${i}" aria-selected="${i===active}">${ic}<span class="nm">${esc(e.label)}</span><span class="wh">${esc(e.where)}</span></button>`;
}
function renderGuide(){
  const blds=DATA.buildings.slice().sort((a,b)=>a.no-b.no).map(b=>({type:'bld',b,label:`${b.no}號 ${b.name}`,where:`${b.floors.filter(f=>f>0).length}F${b.floors.includes(0)?'＋B1':''}`,col:'#1c2632'}));
  const lms=LANDMARKS.filter(l=>l.o).map(l=>({type:'lm',l,label:l.name,where:'',col:'#7d8790'}));
  hits=[...blds,...lms]; active=-1;
  list.innerHTML=`<div class="sec">建築</div>${blds.map((e,i)=>itemHtml(e,i)).join('')}<div class="sec">校園地點</div>${lms.map((e,i)=>itemHtml(e,i+blds.length)).join('')}`;
  bindList();
}
function bindList(){ list.querySelectorAll('.item').forEach(bt=>bt.onclick=()=>choose(hits[+bt.dataset.i])); }
function runSearch(){
  const s=norm(q.value);
  if(!s){ renderGuide(); return; }
  hits=index.map(e=>{ let sc=99;
    if(e.code&&norm(e.code)===s) sc=0; else if(e.code&&norm(e.code).startsWith(s)) sc=1;
    else if(norm(e.label)===s) sc=1; else if(norm(e.label).startsWith(s)) sc=2; else if(e.hay.includes(s)) sc=3;
    return [sc,e]; }).filter(([s])=>s<99).sort((a,b)=>a[0]-b[0]||(a[1].code||'zz').localeCompare(b[1].code||'zz')).slice(0,30).map(x=>x[1]);
  active=0;
  list.innerHTML=hits.length?`<div class="sec">搜尋結果 · ${hits.length}</div>`+hits.map(itemHtml).join(''):`<div class="empty">找不到「${esc(q.value)}」。試試教室編號（如 223）或名稱（如 英語）。</div>`;
  bindList();
}
function choose(e){
  if(!e) return;
  if(e.type==='room') select(e.r,{fly:true});
  else if(e.type==='bld') selectBuilding(e.b);
  else goLandmark(e.l);
}
q.addEventListener('input',runSearch);
q.addEventListener('keydown',e=>{
  const bs=[...list.querySelectorAll('.item')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); if(!bs.length) return; active=((active<0?-1:active)+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length; bs.forEach((b,i)=>b.setAttribute('aria-selected',String(i===active))); bs[active].scrollIntoView({block:'nearest'}); }
  else if(e.key==='Enter'){ e.preventDefault(); choose(hits[Math.max(0,active)]); }
  else if(e.key==='Escape'){ q.value=''; renderGuide(); }
});
renderGuide();

// hint bar
const hint=document.getElementById('hint'), hintTg=document.getElementById('hintTg');
hintTg.onclick=()=>{ const m=!hint.classList.contains('min'); hint.classList.toggle('min',m); hintTg.style.transform=m?'rotate(180deg)':''; hintTg.setAttribute('aria-expanded',String(!m)); };

// ---------- picking ----------
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2(), tip=document.getElementById('tip');
let down=null;
function pick(e){
  const rect=renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX-rect.left)/rect.width)*2-1,-((e.clientY-rect.top)/rect.height)*2+1);
  ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(pickables.filter(m=>m.visible),false)[0];
  if(!hit) return null;
  const u=hit.object.userData;
  return u.room?{room:u.room}:u.bld?{bld:u.bld}:null;
}
renderer.domElement.addEventListener('pointerdown',e=>{ down=[e.clientX,e.clientY]; if(controls.autoRotate){ controls.autoRotate=false; spinBtn.setAttribute('aria-pressed','false'); } });
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down) return; const moved=Math.hypot(e.clientX-down[0],e.clientY-down[1]); down=null;
  if(moved>5) return; const h=pick(e);
  if(h&&h.room) select(h.room); else if(h&&h.bld) selectBuilding(h.bld); else if(selected||selB){ select(null); }
});
let lastMove=0;
renderer.domElement.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse'||down){ tip.hidden=true; return; }
  const now=performance.now(); if(now-lastMove<40) return; lastMove=now;
  const h=pick(e);
  renderer.domElement.style.cursor=h?'pointer':'';
  if(h){ tip.textContent=h.room?`${h.room.code?h.room.code+' · ':''}${h.room.name}　${h.room.bld.name} ${h.room.floors.map(fl).join('/')}`:`${h.bld.no}號 ${h.bld.name}（點擊查看）`;
    tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px'; tip.hidden=false; } else tip.hidden=true;
});
renderer.domElement.addEventListener('pointerleave',()=>tip.hidden=true);

// ---------- loop ----------
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h); labelR.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); }

addEventListener('resize',resize); resize();
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const clock=new THREE.Clock();
function tick(){
  const now=performance.now();
  if(anim){ const t=Math.min(1,(now-anim.t0)/anim.dur), k=ease(t); camera.position.lerpVectors(anim.fromP,anim.toP,k); controls.target.lerpVectors(anim.fromT,anim.toT,k); if(t>=1) anim=null; }
  controls.update();
  const far=camera.position.distanceTo(controls.target)>(innerWidth<720?170:230);
  if(far!==labelsEl.classList.contains('compact')) labelsEl.classList.toggle('compact',far);
  if(pin.visible){ const t=clock.getElapsedTime(); pin.position.y=pin.userData.y+Math.sin(t*3)*.4; pin.rotation.y=t*1.2;
    if(selected) selected.meshes.forEach(m=>m.material.emissive.setRGB(.35*(.5+.5*Math.sin(t*4)),.25*(.5+.5*Math.sin(t*4)),0)); }
  renderer.render(scene,camera); labelR.render(scene,camera);
  requestAnimationFrame(tick);
}
camera.position.copy(homePos().add(homeT())); controls.target.copy(homeT());
setFloor('all');
const h=location.hash.match(/^#r([0-9A-Z-]+)$/);
if(h){ const r=DATA.rooms.find(x=>x.code.replace(/\//g,'-')===h[1]); if(r) setTimeout(()=>select(r,{fly:true}),300); }
tick();
window.__campus={DATA,setFloor,select,selectBuilding,B,camera,controls};
</script>
